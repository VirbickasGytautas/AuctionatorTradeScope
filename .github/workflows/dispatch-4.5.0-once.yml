name: TradeScope 4.5.0 - Dispatch the tagged publisher

# One-time recovery: the GitHub-created tag does not trigger a second push
# workflow, so explicitly dispatch the existing validated tag publisher.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/dispatch-4.5.0-once.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch-tagged-release:
    if: github.repository == 'VirbickasGytautas/AuctionatorTradeScope'
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact stable tag and one-time trigger
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          parent=$(gh api "repos/$repo/commits/$GITHUB_SHA" --jq '.parents[0].sha')
          test "$parent" = 99c405abeff112f395bf571599bfd04fddc61623
          ref_sha=$(gh api "repos/$repo/git/ref/tags/v4.5.0" --jq '.object.sha')
          target=$(gh api "repos/$repo/git/tags/$ref_sha" --jq '.object.sha')
          test "$target" = bb533f909cf273f68739d0bb6caf29885a3d2ae6 || {
            echo "::error::Stable tag does not match verified release"; exit 1;
          }
          echo "Verified annotated v4.5.0 tag at the tested release commit."

      - name: Trigger tagged CurseForge workflow (workflow_dispatch)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/curseforge-beta-publish.yml/dispatches" -f ref=main -f 'inputs[release_tag]=v4.5.0'
          echo "Dispatched verified v4.5.0 from main via workflow_dispatch"
