name: TradeScope - Build Only

on:
  push:
    branches:
      - main
      - beta/4.4.0-refactor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate addon metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f AuctionatorTradeScope.toc
          test -f pkgmeta.yaml
          grep -Eq '^## Interface:[[:space:]]*16001[[:space:]]*$' AuctionatorTradeScope.toc
          grep -Eq '^package-as:[[:space:]]*AuctionatorTradeScope[[:space:]]*$' pkgmeta.yaml
          while IFS= read -r entry; do
            entry="${entry//\\//}"
            test -f "$entry" || { echo "::error::Missing TOC source: $entry"; exit 1; }
          done < <(grep -E '^[^#[:space:]].*\.lua[[:space:]]*$' AuctionatorTradeScope.toc | tr -d '\r')
      - name: Install Lua 5.1 for regression tests
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
      - name: Run Lua regression suite
        shell: bash
        run: |
          set -euo pipefail
          for test in test-toc test-ui-modules test-craft-batch test-craft-report test-graph-cursor test-journal-analysis test-journal-ui test-dashboard-ui; do
            echo "Checking $test"
            lua5.1 "scripts/$test.lua"
          done
      - name: Package addon without publishing
        uses: BigWigsMods/packager@v2.6.1
        with:
          args: -d -p 1796279
      - name: Verify package integrity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package-artifacts
          cp .release/*.zip package-artifacts/
          for zip in package-artifacts/*.zip; do
            unzip -t "$zip"
          done
      - name: Preserve dry-run package
        uses: actions/upload-artifact@v4
        with:
          name: tradescope-refactor-build
          path: package-artifacts/*.zip
          if-no-files-found: error
          retention-days: 7
