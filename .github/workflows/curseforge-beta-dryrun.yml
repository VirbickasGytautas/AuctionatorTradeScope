name: TradeScope - Build Only

on:
  push:
    branches:
      - main
      - beta/4.4.0-refactor
      - beta/4.5.0-portfolio
      - beta/4.6.0-strategies
      - beta/5.0.0-terminal-ui
      - beta/5.0.0-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate addon metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f AuctionatorTradeScope.toc
          test -f pkgmeta.yaml
          grep -Eq '^## Interface:[[:space:]]*16001[[:space:]]*$' AuctionatorTradeScope.toc
          grep -Eq '^package-as:[[:space:]]*AuctionatorTradeScope[[:space:]]*$' pkgmeta.yaml
          while IFS= read -r entry; do
            entry="${entry//\\//}"
            test -f "$entry" || { echo "::error::Missing TOC source: $entry"; exit 1; }
          done < <(grep -E '^[^#[:space:]].*\.lua[[:space:]]*$' AuctionatorTradeScope.toc | tr -d '\r')
      - name: Install Lua 5.1 for regression tests
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
      - name: Run Lua regression suite
        shell: bash
        run: |
          set -euo pipefail
          # Validate Lua 5.1 syntax for every source and test before execution.
          while IFS= read -r -d '' file; do
            luac5.1 -p "$file"
          done < <(find Engine UI Finance Market Crafting Data Localization scripts -type f -name '*.lua' -print0)
          # Run every test in a deterministic order, including new UI regressions.
          while IFS= read -r -d '' test; do
            echo "Checking $test"
            lua5.1 "$test"
          done < <(find scripts -maxdepth 1 -type f -name 'test-*.lua' -print0 | sort -z)
      - name: Package addon without publishing
        uses: BigWigsMods/packager@v2.6.1
        with:
          args: -d -p 1796279
      - name: Verify package integrity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package-artifacts
          cp .release/*.zip package-artifacts/
          for zip in package-artifacts/*.zip; do
            unzip -t "$zip"
          done
      - name: Create exact source archive for VS Code
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^## Version:[[:space:]]*//p' AuctionatorTradeScope.toc | tr -d '\r')"
          test -n "$VERSION"
          mkdir -p source-artifacts
          git archive --format=zip --output="source-artifacts/TradeScope_${VERSION}_Source.zip" HEAD
          unzip -t "source-artifacts/TradeScope_${VERSION}_Source.zip"
      - name: Preserve VS Code source archive
        uses: actions/upload-artifact@v4
        with:
          name: tradescope-source-build
          path: source-artifacts/*.zip
          if-no-files-found: error
          retention-days: 7
      - name: Preserve dry-run package
        uses: actions/upload-artifact@v4
        with:
          name: tradescope-refactor-build
          path: package-artifacts/*.zip
          if-no-files-found: error
          retention-days: 7
