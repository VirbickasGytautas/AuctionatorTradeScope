name: TradeScope 4.5.0 - One-time verified CurseForge release

# Creating this file is the one and only automatic trigger. A re-run is
# deliberately blocked once v4.5.0 exists, preventing duplicate uploads.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-4.5.0-once.yml'

permissions:
  contents: write

concurrency:
  group: tradescope-4.5.0-curseforge-once
  cancel-in-progress: false

jobs:
  publish-4-5-0:
    if: github.repository == 'VirbickasGytautas/AuctionatorTradeScope'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release-trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tested release, unique tag and publisher credential
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
        run: |
          set -euo pipefail
          release=bb533f909cf273f68739d0bb6caf29885a3d2ae6
          test -n "$CF_API_TOKEN" || { echo "::error::CF_API_KEY secret not configured"; exit 1; }
          # Only the one-workflow commit may be added after the tested release.
          test "$(git rev-parse "$GITHUB_SHA^")" = "$release" || {
            echo "::error::Release head changed; publication aborted"; exit 1;
          }
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || {
            echo "::error::main moved during publishing"; exit 1;
          }
          test "$(git show "$release":AuctionatorTradeScope.toc | sed -n 's/^## Version:[[:space:]]*//p' | tr -d '\r')" = "4.5.0"
          git show "$release":AuctionatorTradeScope.toc | grep -Eq '^## Interface:[[:space:]]*16001[[:space:]]*$'
          git show "$release":pkgmeta.yaml | grep -Eq '^package-as:[[:space:]]*AuctionatorTradeScope[[:space:]]*$'
          test "$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")" = ".github/workflows/publish-4.5.0-once.yml" || {
            echo "::error::Unexpected extra release changes"; exit 1;
          }
          if git ls-remote --exit-code --tags origin refs/tags/v4.5.0 >/dev/null 2>&1; then
            echo "::error::Tag v4.5.0 already exists; refusing duplicate publication"
            exit 1
          fi
          echo "Validated game-tested 4.5.0 and configured publication credential."

      - name: Create and push annotated v4.5.0 tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v4.5.0 bb533f909cf273f68739d0bb6caf29885a3d2ae6 \
            -m "Auctionator TradeScope 4.5.0 Stable Release"
          git push origin refs/tags/v4.5.0

      - name: Check out exact tagged release
        uses: actions/checkout@v4
        with:
          ref: v4.5.0
          fetch-depth: 0

      - name: Re-validate annotated release tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = bb533f909cf273f68739d0bb6caf29885a3d2ae6
          test "$(git describe --exact-match --tags HEAD)" = "v4.5.0"
          grep -Eq '^## Version:[[:space:]]*4\.5\.0[[:space:]]*$' AuctionatorTradeScope.toc
          grep -Eq '^## Interface:[[:space:]]*16001[[:space:]]*$' AuctionatorTradeScope.toc

      - name: Package and publish stable 4.5.0 to CurseForge
        uses: BigWigsMods/packager@v2.6.1
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
        with:
          args: -p 1796279

      - name: Preserve published ZIP for verification
        if: always()
        shell: bash
        run: |
          mkdir -p package-artifacts
          find .release -maxdepth 1 -name '*.zip' -type f -exec cp {} package-artifacts/ \; 2>/dev/null || true

      - name: Store published artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradescope-4.5.0-curseforge
          path: package-artifacts/*.zip
          if-no-files-found: warn
          retention-days: 14
